<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="BLT-CVE — Decentralized Vulnerability Registry. Standards-driven, machine-readable, and cryptographically verifiable." />
    <title>Registry — BLT-CVE</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/common.css" />
    <script src="./js/common.js"></script>
</head>

<body class="font-sans text-gray-900 antialiased dark:bg-dark-base dark:text-gray-100 relative">
    <!-- Icons -->
    <svg xmlns="http://www.w3.org/2000/svg" class="hidden">
        <symbol id="fa-search" viewBox="0 0 512 512">
            <path
                d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z" />
        </symbol>
        <symbol id="fa-moon" viewBox="0 0 512 512">
            <path
                d="M223.5 32C100 32 0 132 0 255.5S100 479 223.5 479c60.6 0 115.5-24.2 155.8-63.4 5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-7.8c-11.2 3.1-23.1 4.7-35.4 4.7-88.8 0-160.8-72-160.8-160.8 0-61.6 34.5-115.1 85-142.3 6.1-3.3 8.3-10.8 5-16.9s-10.3-9.5-17.2-7.6c-13.6 3.7-28 5.7-43 5.7z" />
        </symbol>
        <symbol id="fa-sun" viewBox="0 0 512 512">
            <path
                d="M256 128a128 128 0 1 0 128 128 128 128 0 0 0-128-128zm0 224a96 96 0 1 1 96-96 96 96 0 0 1-96 96zm0-240a16 16 0 0 1-16-16V48a16 16 0 0 1 32 0v48a16 16 0 0 1-16 16zm0 304a16 16 0 0 1-16 16v48a16 16 0 0 1 32 0v-48a16 16 0 0 1-16-16zm232-152h48a16 16 0 0 1 0 32h-48a16 16 0 0 1 0-32zM48 240h48a16 16 0 0 1 0 32H48a16 16 0 0 1 0-32zm301.9-106.3a16 16 0 0 1 0-22.6l33.9-33.9a16 16 0 1 1 22.6 22.6l-33.9 33.9a16 16 0 0 1-22.6 0zM107.5 359a16 16 0 1 1 22.6 22.6L96.2 415.5a16 16 0 0 1-22.6-22.6zM350 359a16 16 0 0 1 22.6 0l33.9 33.9a16 16 0 1 1-22.6 22.6l-33.9-33.9a16 16 0 0 1 0-22.6zM107.5 153a16 16 0 0 1 0-22.6l33.9-33.9a16 16 0 0 1 22.6 22.6l-33.9 33.9a16 16 0 0 1-22.6 0z" />
        </symbol>
    </svg>

    <header id="main-header"
        class="sticky top-0 z-50 border-b border-neutral-border bg-white/95 backdrop-blur dark:border-gray-700 dark:bg-dark-surface/95">
        <!-- Injected by common.js -->
    </header>

    <main class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
        <div class="mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight text-gray-900 dark:text-gray-100">Vulnerability Registry
            </h1>
            <p class="mt-2 text-lg text-gray-600 dark:text-gray-400">Browse the community-assigned vulnerability
                identifiers.</p>
        </div>

        <!-- Search and Filters -->
        <div class="mb-8 flex flex-wrap gap-4 items-center justify-between">
            <div class="relative w-full max-w-md">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                    <svg class="fa-icon w-4 h-4 text-gray-400">
                        <use href="#fa-search"></use>
                    </svg>
                </div>
                <input type="text" id="search-input"
                    class="block w-full rounded-lg border border-neutral-border bg-white px-10 py-2.5 text-sm focus:border-primary focus:ring-primary dark:border-gray-700 dark:bg-dark-surface dark:text-white"
                    placeholder="Search ID, title, or severity...">
            </div>

            <div class="flex items-center gap-2">
                <span class="text-sm font-medium text-gray-500">Filter Severity:</span>
                <select id="severity-filter"
                    class="rounded-lg border border-neutral-border bg-white px-3 py-2 text-sm focus:border-primary focus:ring-primary dark:border-gray-700 dark:bg-dark-surface dark:text-white">
                    <option value="all">All</option>
                    <option value="critical">Critical (9.0-10.0)</option>
                    <option value="high">High (7.0-8.9)</option>
                    <option value="medium">Medium (4.0-6.9)</option>
                    <option value="low">Low (0.1-3.9)</option>
                </select>
            </div>
        </div>

        <!-- Registry Table -->
        <div class="surface-card overflow-hidden rounded-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-gray-50 dark:bg-gray-800/50">
                            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-500">BLT ID</th>
                            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-500">Severity</th>
                            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-500">Summary</th>
                            <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-500">Details</th>
                        </tr>
                    </thead>
                    <tbody id="registry-body" class="divide-y divide-neutral-border dark:divide-gray-700">
                        <!-- Content will be injected by JavaScript -->
                        <tr id="loading-row">
                            <td colspan="4" class="px-6 py-12 text-center text-gray-500">Loading registry entries...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
    <footer id="main-footer"
        class="mt-24 border-t border-neutral-border bg-white py-12 dark:border-gray-700 dark:bg-dark-surface">
        <!-- Injected by common.js -->
    </footer>

    <script>
        // Registry Logic
        let allEntries = [];
        const registryBody = document.getElementById('registry-body');
        const searchInput = document.getElementById('search-input');
        const severityFilter = document.getElementById('severity-filter');

        async function fetchRegistry() {
            try {
                const response = await fetch('./index.json');
                const data = await response.json();

                // Fetch full details for each entry in background to get the titles
                // In a real app, index.json might contain titles to avoid separate fetches
                allEntries = await Promise.all(data.entries.map(async entry => {
                    try {
                        const detailRes = await fetch(`.${entry.path}`);
                        const details = await detailRes.json();
                        return { ...entry, title: details.title };
                    } catch (e) {
                        return { ...entry, title: 'No title available' };
                    }
                }));

                renderEntries(allEntries);
            } catch (error) {
                console.error('Error fetching registry:', error);
                registryBody.innerHTML = '<tr><td colspan="4" class="px-6 py-12 text-center text-red-500">Error loading registry. Please try again later.</td></tr>';
            }
        }

        function getSeverityClass(score) {
            if (score == null) return 'bg-gray-100 text-gray-700 dark:bg-gray-900/40 dark:text-gray-300';
            if (score >= 9.0) return 'bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300';
            if (score >= 7.0) return 'bg-orange-100 text-orange-700 dark:bg-orange-900/40 dark:text-orange-300';
            if (score >= 4.0) return 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/40 dark:text-yellow-300';
            return 'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300';
        }

        function renderEntries(entries) {
            if (entries.length === 0) {
                registryBody.innerHTML = '<tr><td colspan="4" class="px-6 py-12 text-center text-gray-500">No matching vulnerabilities found.</td></tr>';
                return;
            }

            registryBody.innerHTML = entries.map(entry => `
                <tr class="hover:bg-gray-50 dark:hover:bg-gray-800/30 transition-colors">
                    <td class="px-6 py-4 font-mono text-sm font-bold text-gray-900 dark:text-gray-100">${entry.id}</td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-bold ${getSeverityClass(entry.severity ?? 0)}">
            ${entry.severity != null ? entry.severity.toFixed(1) : 'N/A'}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-600 dark:text-gray-300 max-w-md truncate">
                        ${entry.title}
                    </td>
                    <td class="px-6 py-4">
                        <a href="./cve.html?id=${entry.id}" class="text-primary text-sm font-bold hover:underline">View Details</a>
                    </td>
                </tr>
            `).join('');
        }

        function filterRegistry() {
            const query = searchInput.value.toLowerCase();
            const severityValue = severityFilter.value;

            const filtered = allEntries.filter(entry => {
                const matchesSearch = entry.id.toLowerCase().includes(query) ||
                    entry.title.toLowerCase().includes(query) ||
                    entry.severity.toString().includes(query);

                let matchesSeverity = true;
                if (severityValue === 'critical') matchesSeverity = entry.severity >= 9.0;
                else if (severityValue === 'high') matchesSeverity = entry.severity >= 7.0 && entry.severity < 9.0;
                else if (severityValue === 'medium') matchesSeverity = entry.severity >= 4.0 && entry.severity < 7.0;
                else if (severityValue === 'low') matchesSeverity = entry.severity < 4.0;

                return matchesSearch && matchesSeverity;
            });

            renderEntries(filtered);
        }

        searchInput.addEventListener('input', filterRegistry);
        severityFilter.addEventListener('change', filterRegistry);

        fetchRegistry();
    </script>
</body>

</html>
