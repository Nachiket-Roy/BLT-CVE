<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="BLT-CVE — Decentralized Vulnerability Registry. Standards-driven, machine-readable, and cryptographically verifiable." />
    <title>CVE Detail — BLT-CVE</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/common.css" />
    <script src="./js/common.js"></script>
</head>

<body class="font-sans text-gray-900 antialiased dark:bg-dark-base dark:text-gray-100 relative">
    <svg xmlns="http://www.w3.org/2000/svg" class="hidden">
        <symbol id="fa-arrow-left" viewBox="0 0 448 512">
            <path
                d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288 416 288c17.7 0 32-14.3 32-32s-14.3-32-32-32l-306.7 0L214.6 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z" />
        </symbol>
        <symbol id="fa-moon" viewBox="0 0 512 512">
            <path
                d="M223.5 32C100 32 0 132 0 255.5S100 479 223.5 479c60.6 0 115.5-24.2 155.8-63.4 5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-7.8c-11.2 3.1-23.1 4.7-35.4 4.7-88.8 0-160.8-72-160.8-160.8 0-61.6 34.5-115.1 85-142.3 6.1-3.3 8.3-10.8 5-16.9s-10.3-9.5-17.2-7.6c-13.6 3.7-28 5.7-43 5.7z" />
        </symbol>
        <symbol id="fa-sun" viewBox="0 0 512 512">
            <path
                d="M256 128a128 128 0 1 0 128 128 128 128 0 0 0-128-128zm0 224a96 96 0 1 1 96-96 96 96 0 0 1-96 96zm0-240a16 16 0 0 1-16-16V48a16 16 0 0 1 32 0v48a16 16 0 0 1-16 16zm0 304a16 16 0 0 1-16 16v48a16 16 0 0 1 32 0v-48a16 16 0 0 1-16-16zm232-152h48a16 16 0 0 1 0 32h-48a16 16 0 0 1 0-32zM48 240h48a16 16 0 0 1 0 32H48a16 16 0 0 1 0-32zm301.9-106.3a16 16 0 0 1 0-22.6l33.9-33.9a16 16 0 1 1 22.6 22.6l-33.9 33.9a16 16 0 0 1-22.6 0zM107.5 359a16 16 0 1 1 22.6 22.6L96.2 415.5a16 16 0 0 1-22.6-22.6zM350 359a16 16 0 0 1 22.6 0l33.9 33.9a16 16 0 1 1-22.6 22.6l-33.9-33.9a16 16 0 0 1 0-22.6zM107.5 153a16 16 0 0 1 0-22.6l33.9-33.9a16 16 0 0 1 22.6 22.6l-33.9 33.9a16 16 0 0 1-22.6 0z" />
        </symbol>
    </svg>

    <header id="main-header"
        class="sticky top-0 z-50 border-b border-neutral-border bg-white/95 backdrop-blur dark:border-gray-700 dark:bg-dark-surface/95">
        <!-- Injected by common.js -->
    </header>

    <main class="mx-auto max-w-4xl px-4 py-12 sm:px-6 lg:px-8">
        <a href="./registry.html"
            class="inline-flex items-center gap-2 text-sm font-bold text-gray-500 hover:text-primary transition-colors mb-8">
            <svg class="fa-icon w-3 h-3">
                <use href="#fa-arrow-left"></use>
            </svg>
            Back to Registry
        </a>

        <div id="cve-container" class="opacity-0 transition-opacity duration-500">
            <!-- Content will be injected by JavaScript -->
            <div class="animate-pulse space-y-8">
                <div class="h-10 bg-gray-200 dark:bg-gray-700 rounded w-1/4"></div>
                <div class="h-16 bg-gray-200 dark:bg-gray-700 rounded w-3/4"></div>
                <div class="h-64 bg-gray-200 dark:bg-gray-700 rounded-2xl w-full"></div>
            </div>
        </div>
    </main>

    <script>
        // CVE Detail Logic
        const container = document.getElementById('cve-container');
        const urlParams = new URLSearchParams(window.location.search);
        const cveId = urlParams.get('id');

        async function fetchCVEDetails() {
            if (!cveId) {
                container.innerHTML = '<div class="text-center py-20"><h1 class="text-2xl font-bold text-red-500">No CVE ID specified.</h1><p class="mt-4">Please select a vulnerability from the <a href="./registry.html" class="text-primary underline">registry</a>.</p></div>';
                container.classList.remove('opacity-0');
                return;
            }

            try {
                // Find path from index.json first
                const indexRes = await fetch('./index.json');
                const indexData = await indexRes.json();
                const entry = indexData.entries.find(e => e.id === cveId);

                if (!entry) {
                    throw new Error('CVE not found in registry index.');
                }

                const response = await fetch(`.${entry.path}`);
                const data = await response.json();
                renderCVE(data, entry);
            } catch (error) {
                console.error('Error fetching CVE:', error);
                container.innerHTML = `<div class="text-center py-20"><h1 class="text-2xl font-bold text-red-500">Vulnerability not found.</h1><p class="mt-4 text-gray-500">${error.message}</p></div>`;
            }
            container.classList.remove('opacity-0');
        }

        function getSeverityColor(score) {
            if (score >= 9.0) return 'text-red-600 dark:text-red-400';
            if (score >= 7.0) return 'text-orange-600 dark:text-orange-400';
            if (score >= 4.0) return 'text-yellow-600 dark:text-yellow-400';
            return 'text-blue-600 dark:text-blue-400';
        }

        function renderCVE(data, entry) {
            container.innerHTML = `
                <div class="mb-10">
                    <span class="text-sm font-bold text-primary uppercase tracking-widest">${data.id}</span>
                    <h1 class="mt-2 text-4xl font-extrabold tracking-tight text-gray-900 dark:text-gray-100">${data.title}</h1>
                    <div class="mt-6 flex flex-wrap gap-6 text-sm">
                        <div>
                            <span class="block text-gray-500 font-medium">Published</span>
                            <span class="font-bold">${new Date(data.published).toLocaleDateString()}</span>
                        </div>
                        <div>
                            <span class="block text-gray-500 font-medium">Modified</span>
                            <span class="font-bold">${new Date(data.modified).toLocaleDateString()}</span>
                        </div>
                        <div>
                            <span class="block text-gray-500 font-medium">Reporter</span>
                            <span class="font-bold">${data.reporter}</span>
                        </div>
                    </div>
                </div>

                <div class="grid gap-8 lg:grid-cols-3">
                    <div class="lg:col-span-2 space-y-10">
                        <!-- Description -->
                        <section>
                            <h2 class="text-xl font-bold text-gray-900 dark:text-white border-b border-neutral-border dark:border-gray-800 pb-2 mb-4">Description</h2>
                            <p class="text-lg leading-relaxed text-gray-600 dark:text-gray-300 whitespace-pre-wrap">${data.description}</p>
                        </section>

                        <!-- Affected Products -->
                        <section>
                            <h2 class="text-xl font-bold text-gray-900 dark:text-white border-b border-neutral-border dark:border-gray-800 pb-2 mb-4">Affected Products</h2>
                            <div class="space-y-4">
                                ${data.affected.map(item => `
                                    <div class="surface-card p-4 rounded-xl">
                                        <p class="text-sm font-medium text-gray-500 uppercase tracking-tight">${item.vendor}</p>
                                        <p class="text-xl font-bold">${item.product}</p>
                                        <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">Versions: <span class="font-mono bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded">${item.versions}</span></p>
                                    </div>
                                `).join('')}
                            </div>
                        </section>

                        <!-- References -->
                        <section>
                            <h2 class="text-xl font-bold text-gray-900 dark:text-white border-b border-neutral-border dark:border-gray-800 pb-2 mb-4">References</h2>
                            <ul class="space-y-2">
                                ${data.references.map(ref => `
                                    ${(ref.startsWith('https://') || ref.startsWith('http://')) ? `
                                    <li>
                                        <a href="${ref}" target="_blank" rel="noopener noreferrer" class="text-primary hover:underline break-all inline-flex items-center gap-2">
                                            ${ref}
                                            <svg class="fa-icon w-3 h-3" viewBox="0 0 448 512"><path d="M432 320c-13.3 0-24 10.7-24 24v112c0 4.4-3.6 8-8 8H48c-4.4 0-8-3.6-8-8V112c0-4.4 3.6-8 8-8h112c13.3 0 24-10.7 24-24s-10.7-24-24-24H48C21.5 56 0 77.5 0 104v352c0 26.5 21.5 48 48 48h352c26.5 0 48-21.5 48-48V344c0-13.3-10.7-24-24-24zm-112-280h104c8.8 0 16 7.2 16 16v104c0 8.8-7.2 16-16 16s-16-7.2-16-16V102.6L169.4 343.4c-6.2 6.2-16.4 6.2-22.6 0s-6.2-16.4 0-22.6L387.4 80H336c-8.8 0-16-7.2-16-16s7.2-16 16-16z"/></svg>
                                        </a>
                                    </li>
                                    ` : `<li class="text-gray-500">${ref} (invalid URL)</li>`}
                                `).join('')}
                            </ul>
                        </section>
                    </div>

                    <!-- Sidebar: Severity -->
                    <div class="space-y-4">
                        <div class="surface-card p-6 rounded-2xl text-center">
                            <h2 class="text-sm font-bold text-gray-500 uppercase tracking-widest mb-4">Severity</h2>
                            <div class="text-6xl font-black ${getSeverityColor(data.severity.cvss_score)}">
                                ${data.severity.cvss_score.toFixed(1)}
                            </div>
                            <p class="mt-4 font-mono text-xs text-gray-500 break-all leading-relaxed">${data.severity.vector}</p>
                        </div>
                        
                        <div class="surface-card p-6 rounded-2xl bg-gray-50 dark:bg-gray-800/30">
                            <h2 class="text-sm font-bold text-gray-900 dark:text-white mb-2">Machine-Readable</h2>
                            <p class="text-xs text-gray-500 mb-4">Integrate this entry into your security tools.</p>
                            <a href=".${entry.path}" download class="w-full inline-flex justify-center rounded-lg border border-neutral-border bg-white px-4 py-2 text-xs font-bold transition hover:bg-gray-50 dark:border-gray-700 dark:bg-dark-surface dark:text-white">
                                Download JSON
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        fetchCVEDetails();
    </script>

    <footer id="main-footer"
        class="mt-24 border-t border-neutral-border bg-white py-12 dark:border-gray-700 dark:bg-dark-surface">
        <!-- Injected by common.js -->
    </footer>
</body>

</html>
